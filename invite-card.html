<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Montserrat:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet" />
<style>
  :root {
    --ivory: #faf7f1;
    --cream: #f1e8d8;
    --paper: #fffdf9;
    --ink: #2b2521;
    --ink-soft: #4d453b;
    --stone: #8c8171;
    --gold: #b08d57;
    --gold-soft: #e3d1a4;
    --serif: "Cormorant Garamond", Georgia, serif;
    --script: "Great Vibes", cursive;
    --sans: "Montserrat", Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; }
  body {
    font-family: var(--sans);
    color: var(--ink-soft);
    background:
      radial-gradient(ellipse at 50% 0%, rgba(176, 141, 87, 0.14), transparent 55%),
      radial-gradient(ellipse at 50% 100%, rgba(176, 141, 87, 0.08), transparent 55%),
      var(--ivory);
  }
  .card { width: 1080px; height: 1440px; padding: 30px; }
  .frame {
    width: 100%;
    height: 100%;
    border: 2px solid var(--gold);
    border-radius: 4px;
    padding: 8px;
  }
  .inner {
    width: 100%;
    height: 100%;
    border: 1px solid rgba(176, 141, 87, 0.5);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 50px 64px 46px;
  }
  .monogram {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: 112px;
    height: 112px;
    border: 1px solid var(--gold);
    border-radius: 50%;
    color: var(--ink);
    font-family: var(--script);
    box-shadow: 0 0 0 7px rgba(176, 141, 87, 0.12);
    margin-bottom: 22px;
  }
  .monogram span { font-size: 52px; line-height: 1; }
  .monogram small { font-size: 24px; color: var(--gold); }
  .eyebrow {
    font-size: 19px;
    letter-spacing: 0.44em;
    text-transform: uppercase;
    color: var(--stone);
    margin-bottom: 20px;
    padding-left: 0.44em;
  }
  .names {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .names__name {
    font-family: var(--serif);
    font-weight: 600;
    color: var(--ink);
    font-size: 78px;
    line-height: 1.02;
    letter-spacing: 0.01em;
  }
  .names__amp {
    font-family: var(--script);
    font-size: 58px;
    color: var(--gold);
    line-height: 1;
    margin: 2px 0;
  }
  .divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    width: 300px;
    margin: 24px 0 8px;
  }
  .divider__line { height: 1px; flex: 1; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
  .divider__diamond { width: 7px; height: 7px; background: var(--gold); transform: rotate(45deg); box-shadow: 0 0 0 4px rgba(176, 141, 87, 0.16); }
  .subtitle {
    font-family: var(--serif);
    font-style: italic;
    font-size: 30px;
    color: var(--ink-soft);
  }
  .photo {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    width: 100%;
    min-height: 0;
    margin: 22px 0 6px;
  }
  .photo-frame {
    height: 100%;
    max-height: 380px;
    aspect-ratio: 3 / 4;
    border-radius: 130px 130px 16px 16px;
    overflow: hidden;
    background: var(--cream);
    border: 1px solid var(--gold-soft);
    box-shadow: 0 30px 60px -30px rgba(43, 37, 30, 0.28);
  }
  .photo-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
  }
  .photo-thumbs {
    display: flex;
    gap: 14px;
    justify-content: center;
    width: 100%;
    max-width: 460px;
  }
  .photo-thumb {
    flex: 1;
    height: 110px;
    border-radius: 14px;
    overflow: hidden;
    background: var(--cream);
    border: 1px solid var(--gold-soft);
    box-shadow: 0 14px 30px -18px rgba(43, 37, 30, 0.3);
  }
  .photo-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .photo-thumb:nth-of-type(1) img { object-position: center 42%; }
  .photo-thumb:nth-of-type(2) img { object-position: center 24%; }
  .photo-thumb:nth-of-type(3) img { object-position: center 38%; }
  .photo-thumb:nth-of-type(4) img { object-position: center 78%; }
  .details {
    display: flex;
    align-items: stretch;
    justify-content: center;
    gap: 44px;
    margin-top: 8px;
  }
  .details__col { flex: 0 0 300px; width: 300px; }
  .details__sep { width: 1px; background: linear-gradient(var(--gold), transparent, var(--gold)); }
  .details__label {
    font-family: var(--serif);
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--gold);
    font-size: 22px;
    margin-bottom: 8px;
  }
  .details__text { font-family: var(--serif); font-size: 27px; line-height: 1.42; color: var(--ink-soft); }
  .details__text strong { color: var(--ink); font-weight: 600; }
  .footer {
    margin-top: 26px;
    font-family: var(--script);
    font-size: 38px;
    color: var(--gold);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="frame">
      <div class="inner">
        <div class="monogram"><span>R</span><small>&amp;</small><span>N</span></div>
        <p class="eyebrow">Engagement</p>

        <div class="names">
          <div class="names__name">Romin</div>
          <span class="names__amp">&amp;</span>
          <div class="names__name">Namitha</div>
        </div>

        <div class="divider">
          <span class="divider__line"></span>
          <span class="divider__diamond"></span>
          <span class="divider__line"></span>
        </div>
        <p class="subtitle">invite you to celebrate their engagement</p>

        <div class="photo">
          <div class="photo-frame">
            <img src="couple-hero.png?v=20260919" alt="Romin and Namitha together" />
          </div>
          <div class="photo-thumbs">
            <div class="photo-thumb"><img src="./side.jpeg" alt="Romin and Namitha engagement photo" /></div>
            <div class="photo-thumb"><img src="./side2.jpeg" alt="Romin and Namitha engagement photo" /></div>
            <div class="photo-thumb"><img src="./side3.jpeg" alt="Romin and Namitha engagement photo" /></div>
            <div class="photo-thumb"><img src="./side4.jpeg" alt="Romin and Namitha engagement photo" /></div>
          </div>
        </div>

        <div class="details">
          <div class="details__col">
            <div class="details__label">When</div>
            <div class="details__text">Saturday<br /><strong>19 September 2026</strong><br />4:00 PM</div>
          </div>
          <div class="details__sep"></div>
          <div class="details__col">
            <div class="details__label">Where</div>
            <div class="details__text"><strong>Staydium Bungalow Resort</strong><br />Kozhikode<br />Join us for the celebration</div>
          </div>
        </div>

        <p class="footer">With love, we invite you to celebrate with us</p>
      </div>
    </div>
  </div>
</body>
</html>
